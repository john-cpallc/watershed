<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alabama Rainwater Flow Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Rainwater Flow</h1>
    <p class="subtitle">Jefferson County, Alabama — click to trace a raindrop downhill to the watershed outlet.</p>
    <div id="status" class="status">Loading map…</div>
    <div id="cursor" class="cursor"></div>
    <div id="elevation-legend" class="legend hidden"></div>
    <div id="result" class="result hidden"></div>
    <button id="clear" type="button" class="btn hidden">Clear path</button>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/map.js"></script>
</body>
</html>
