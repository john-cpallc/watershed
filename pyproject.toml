[project]
name = "watershed"
version = "0.1.0"
description = "Interactive Alabama rainwater flow map — trace raindrops downhill to the Gulf"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "geopandas>=1.0.0",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "mercantile>=1.2.0",
    "rasterio>=1.4.0",
    "requests>=2.32.0",
    "scipy>=1.14.0",
    "shapely>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watershed", "api"]
